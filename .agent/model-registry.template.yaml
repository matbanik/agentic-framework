---
# Model Capability Registry — TEMPLATE.
#
# This file is the shape of a registry home, not a live registry. Classes are
# capability contracts. Bindings stay empty until an adopter fills them with
# the snapshot ids their own harnesses actually accept. Catalog, pins, and
# retired_slugs stay empty for the same reason: a package whose refresh cycle
# is delete-and-recopy must not carry one machine's pin state.
#
# Copy this file to model-registry.yaml in your drive-root or workspace-root
# `.agent/`, then follow INSTANTIATE.md. The unfilled template does not pass
# schema validation (`catalog` requires at least one entry) — that is
# intentional.
#
# One default per (class, harness). A binding's `slug` is what the resolver
# returns when nobody asks for anything else. A snapshot that should run only
# when someone asks for it by name stays in `catalog` and out of `slug`,
# `alternates` and `fallbacks`. Callers reach it through the explicit override
# (`-Slug`, `--slug`, a dispatch wrapper's `-Model`), which resolves as
# `explicit_override`, or through a task row that names it. `alternates` is the
# wrong home: the resolver falls through to an alternate on its own when the
# default fails the contract or the requested effort. `fallbacks` is optional.
# A binding without it has no same-class rate-limit rung, and a rate limit goes
# to the class's `fallback_rungs`. A class that must never run unasked uses the
# stronger pattern on `architect`: a contract flag, plus `forbid`
# on the classes that must not bind its snapshot.

schema_version: 1
updated: '2026-10-07'
bump_gate: human

catalog: {}

classes:

  coordinator:
    contract:
      capabilities: [orchestration, deep_reasoning, agentic_exec]
      effort_default: high
    bindings: {}

  builder:
    contract:
      capabilities: [agentic_exec, bulk_edit]
      effort_default: medium
      # `high` so both a cheap mechanical pin and a stronger pin can satisfy
      # the class. A `medium` ceiling rejects the stronger pin.
      price_ceiling_band: high
      inherit_allowed: false
    bindings: {}

  # Its own cheap contract: running one row's validation command needs no
  # bulk-edit capability, so the verifier no longer inherits the builder.
  verifier:
    contract:
      capabilities: [validation_runner]
      effort_default: low
      price_ceiling_band: low
      inherit_allowed: false
    bindings: {}

  router:
    contract:
      capabilities: [classification]
      effort_default: low
      price_ceiling_band: low
    bindings: {}

  # Read-only fan-out search. A separate class so it can diverge from the
  # router later without touching any caller.
  scout:
    extends: router

  independent_reviewer:
    contract:
      capabilities: [code_review, agentic_exec, read_only_sandbox]
      vendor_distinct_from: author
      effort_floor: medium
      effort_default: high
      price_ceiling_band: high
      auth_mode: chatgpt-plan
    bindings: {}
    # One machine rung past the primary, then a human (model-routing.md,
    # §Independent-reviewer chain). It fires only on a rate-limit/unavailable
    # receipt from the primary, and its verdict is flagged same-vendor.
    fallback_rungs:
      - harness: claude-p
        class: fallback_reviewer
        flag_if_same_vendor_as_author: true

  # The reviewer for when every `independent_reviewer` rung is limited. Unlike
  # `peer_reviewer` it may author `approved`. Tier floor: reviewer tier >= author
  # tier — the binding covers authors up to its tier, a higher-tier author passes
  # `--slug`, so the contract has no capabilities clause. The tier floor is
  # dispatcher policy, not a contract check: `effort_floor: high` refuses only a
  # snapshot whose effort ceiling is below high; a smaller-tier snapshot that
  # supports high passes it. Never pass `--slug` below the binding's tier.
  fallback_reviewer:
    contract:
      vendor_allow: [anthropic]
      effort_floor: high
      effort_default: high
    bindings: {}

  checklist_validator:
    contract:
      capabilities: [checklist_review]
      effort_default: medium
      price_ceiling_band: low
    bindings: {}

  isolated_worker:
    contract:
      capabilities: [agentic_exec]
      effort_default: medium
      not_a_reviewer: true
    bindings: {}

  # An advisory second opinion from the authoring side. It never writes a
  # verdict and never stands in for `independent_reviewer`.
  peer_reviewer:
    contract:
      capabilities: [deep_reasoning, agentic_exec]
      effort_default: high
      not_a_reviewer: true
    bindings: {}

  architect:
    contract:
      capabilities: [architecture, very_large_single_shot]
      effort_default: high
      invoke_only_on_explicit_human_direction: true
    bindings: {}

  translator_prose:
    contract:
      capabilities: [long_form_prose]
      vendor_allow: [openai]
      effort_floor: high
      effort_default: high
      auth_mode: chatgpt-plan
    bindings: {}

  image_generator:
    contract:
      capabilities: [image_gen]
      auth_mode: chatgpt-plan
    bindings: {}

  creative_prose:
    contract:
      capabilities: [creative_prose]
      vendor_allow: [anthropic]
      effort_default: medium
    bindings: {}

pins: {}

raw_slug_allowlist:
  - '**/docs/execution/plans/20*/**'
  - '**/.agent/plans/20*/**'
  - '**/.agent/context/handoffs/**'
  - '**/.agent/context/sessions/**'
  - '**/.agent/context/grouping/**'
  - '**/docs/execution/reflections/**'
  - '**/docs/execution/metrics.md'
  - '**/_archive/**'
  - '**/_inspiration/**'
  - '**/tests/**/fixtures/**'
  - '**/*.verdict.json'
  - '**/meu-status.yaml'
  - '**/known-issues.yaml'
  - '**/known-issues-archive.md'
  - '**/.agent/skills/subagent-delegation/verification-log.md'
  - '**/.agent/skills/mcp-audit/resources/baseline-snapshot.json'
  - '**/.agent/schemas/headroom-standalone-*.json'
  - '**/.agent/context/MCP/**'
  - 'C:/Temp/**'

retired_slugs: []
