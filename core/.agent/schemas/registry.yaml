# --- Protected regions (skill-optimizer outputs; metadata only, not a behavioral rule) ---
# Machine-staged LEARNED edits land ONLY between these markers and are adopted by a
# human by hand (tools/skill_optimize/stage.py). See AGENTS.md §Authority and Approval.
protected_regions:
  - region_id: learned_instructions
    marker_start: "<!-- LEARNED:START id={region_id} -->"
    marker_end: "<!-- LEARNED:END -->"
    written_by: "skill-optimize workflow (staged for human adoption; never auto-merged)"
    applies_to: ["skills", "workflows", "emerging-standards.md"]
    safety_docs_opt_in: ["AGENTS.md"]
    always_blocked_for_human: ["GUARDRAILS.md"]
